# Node.js 서버 한 대가 화면과 Socket.IO를 함께 제공합니다.
services:
  - type: web
    name: nara-auction
    runtime: node
    region: singapore
    plan: free
    numInstances: 1
    buildCommand: npm ci --include=dev && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /health
    # GitHub main에 push하면 테스트·빌드 성공 후 자동으로 반영합니다.
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
